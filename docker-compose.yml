# ChurchThrive 로컬 컨테이너 스택
# Supabase는 `npx supabase start`(자체 컨테이너)로 먼저 기동 — 웹만 여기서 관리
# 시크릿은 같은 폴더의 .env에서 주입 (.env는 gitignore, 견본은 .env.example)
services:
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    image: churchthrive-web:local
    container_name: churchthrive_web
    ports:
      - "3120:3120"
    environment:
      SUPABASE_URL_INTERNAL: ${SUPABASE_URL_INTERNAL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PHOTOS_LOCAL: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
